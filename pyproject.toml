[project]
name = "ovrlab-ai-research-assignment"
version = "0.1.0"
description = "A local, reproducible model-editing exercise for OVRLab applicants"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.8.0",
  "transformers==4.57.6",
  "huggingface-hub>=0.35,<1",
  "safetensors>=0.6,<1",
  "numpy>=2.2.6,<3",
  "sentencepiece>=0.2,<0.3",
  "protobuf>=4.21,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
python_files = ["test-*.py"]
